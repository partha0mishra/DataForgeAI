version: '3.8'

services:
  # PostgreSQL - Metadata database
  postgres:
    image: postgres:15
    container_name: dataforge-postgres
    environment:
      POSTGRES_USER: dataforge
      POSTGRES_PASSWORD: dataforge
      POSTGRES_DB: dataforge
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dataforge"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis - Cache and Celery broker
  redis:
    image: redis:7-alpine
    container_name: dataforge-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Airflow Webserver
  airflow-webserver:
    build:
      context: ../..
      dockerfile: accelerators/01-pipeline-automation/Dockerfile
      target: airflow
    container_name: dataforge-airflow-webserver
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - AIRFLOW__CORE__EXECUTOR=CeleryExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://dataforge:dataforge@postgres:5432/dataforge
      - AIRFLOW__CELERY__RESULT_BACKEND=db+postgresql://dataforge:dataforge@postgres:5432/dataforge
      - AIRFLOW__CELERY__BROKER_URL=redis://redis:6379/0
      - AIRFLOW__CORE__FERNET_KEY=UKMzEm3yIuFYEq1y3-2FxPNWSVwRASpahmQ9kQfEr8E=
      - AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION=true
      - AIRFLOW__CORE__LOAD_EXAMPLES=false
      - AIRFLOW__WEBSERVER__EXPOSE_CONFIG=true
    ports:
      - "8080:8080"
    command: >
      bash -c "airflow db init &&
               airflow users create --username admin --firstname Admin --lastname User --role Admin --email admin@dataforge.ai --password admin &&
               airflow webserver"
    volumes:
      - ../../accelerators/01-pipeline-automation/airflow/dags:/opt/airflow/dags
      - ../../accelerators/01-pipeline-automation/airflow/plugins:/opt/airflow/plugins
      - airflow-logs:/opt/airflow/logs

  # Airflow Scheduler
  airflow-scheduler:
    build:
      context: ../..
      dockerfile: accelerators/01-pipeline-automation/Dockerfile
      target: airflow
    container_name: dataforge-airflow-scheduler
    depends_on:
      - airflow-webserver
    environment:
      - AIRFLOW__CORE__EXECUTOR=CeleryExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://dataforge:dataforge@postgres:5432/dataforge
      - AIRFLOW__CELERY__RESULT_BACKEND=db+postgresql://dataforge:dataforge@postgres:5432/dataforge
      - AIRFLOW__CELERY__BROKER_URL=redis://redis:6379/0
      - AIRFLOW__CORE__FERNET_KEY=UKMzEm3yIuFYEq1y3-2FxPNWSVwRASpahmQ9kQfEr8E=
    command: airflow scheduler
    volumes:
      - ../../accelerators/01-pipeline-automation/airflow/dags:/opt/airflow/dags
      - ../../accelerators/01-pipeline-automation/airflow/plugins:/opt/airflow/plugins
      - airflow-logs:/opt/airflow/logs

  # Pipeline API
  pipeline-api:
    build:
      context: ../..
      dockerfile: accelerators/01-pipeline-automation/Dockerfile
      target: api
    container_name: dataforge-pipeline-api
    depends_on:
      - postgres
    environment:
      - DATAFORGE_ENV=development
      - LOG_LEVEL=DEBUG
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=dataforge
      - POSTGRES_USER=dataforge
      - POSTGRES_PASSWORD=dataforge
    ports:
      - "8000:8000"

  # Kafka (optional - for streaming)
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: dataforge-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: dataforge-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  # Prometheus - Metrics collection
  prometheus:
    image: prom/prometheus:latest
    container_name: dataforge-prometheus
    volumes:
      - ../../platform-services/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    ports:
      - "9090:9090"

  # Grafana - Metrics visualization
  grafana:
    image: grafana/grafana:latest
    container_name: dataforge-grafana
    depends_on:
      - prometheus
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ../../platform-services/monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - grafana-data:/var/lib/grafana
    ports:
      - "3001:3000"

  # Milvus (Vector Database) - for Knowledge Repository
  milvus-standalone:
    image: milvusdb/milvus:latest
    container_name: dataforge-milvus
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      - etcd
      - minio

  # Supporting services for Milvus
  etcd:
    image: quay.io/coreos/etcd:latest
    container_name: dataforge-etcd
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd

  minio:
    image: minio/minio:latest
    container_name: dataforge-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: minio server /minio_data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"

volumes:
  postgres-data:
  airflow-logs:
  prometheus-data:
  grafana-data:

networks:
  default:
    name: dataforge-network
