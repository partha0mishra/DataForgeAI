name: Code Quality

on:
  push:
    branches: [main, develop, 'claude/**']
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    name: Lint and Format Check
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install black isort flake8 mypy bandit

    - name: Check formatting with black
      run: |
        black --check shared/ accelerators/ || true

    - name: Check imports with isort
      run: |
        isort --check-only shared/ accelerators/ || true

    - name: Lint with flake8
      run: |
        flake8 shared/ accelerators/ --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 shared/ accelerators/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Type check with mypy
      run: |
        mypy shared/ --ignore-missing-imports || true

    - name: Security check with bandit
      run: |
        bandit -r shared/ accelerators/ -ll || true

  validate-yaml:
    name: Validate YAML Files
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Validate Kubernetes manifests
      run: |
        find . -name "*.yaml" -path "*/k8s/*" -exec yamllint {} + || true

    - name: Validate GitHub Actions workflows
      run: |
        find .github/workflows -name "*.yml" -exec yamllint {} + || true

  validate-docker:
    name: Validate Dockerfiles
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Lint Dockerfiles
      uses: hadolint/hadolint-action@v3.1.0
      with:
        dockerfile: "deployments/docker/Dockerfile.base"
        ignore: DL3008,DL3013,DL3015
