server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Airflow logs
  - job_name: airflow
    static_configs:
      - targets:
          - localhost
        labels:
          job: airflow
          __path__: /var/log/airflow/**/*.log

  # System logs
  - job_name: system
    static_configs:
      - targets:
          - localhost
        labels:
          job: system
          __path__: /var/log/*.log

  # Application logs
  - job_name: dataforge-api
    static_configs:
      - targets:
          - localhost
        labels:
          job: dataforge-api
          application: dataforge
          __path__: /var/log/dataforge/**/*.log

  # Docker container logs
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: 'service'

# Pipeline stages for log processing
pipeline_stages:
  # Parse JSON logs
  - json:
      expressions:
        level: level
        timestamp: timestamp
        message: message
        trace_id: trace_id
        span_id: span_id

  # Extract timestamp
  - timestamp:
      source: timestamp
      format: RFC3339

  # Add labels
  - labels:
      level:
      trace_id:
      span_id:

  # Output stage
  - output:
      source: message
