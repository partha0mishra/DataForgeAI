name: 'dataforge_analytics'
version: '1.0.0'
config-version: 2

# Project profile
profile: 'dataforge'

# Source paths
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

# Model configurations
models:
  dataforge_analytics:
    # Staging models
    staging:
      +materialized: view
      +schema: staging
      +tags: ["staging"]

    # Intermediate models
    intermediate:
      +materialized: ephemeral
      +schema: intermediate
      +tags: ["intermediate"]

    # Marts (final analytics models)
    marts:
      +materialized: table
      +schema: marts
      +tags: ["marts"]

# Test severity
tests:
  +severity: error

# Documentation
docs:
  node_colors:
    staging: "#66BB6A"
    intermediate: "#FFA726"
    marts: "#42A5F5"
