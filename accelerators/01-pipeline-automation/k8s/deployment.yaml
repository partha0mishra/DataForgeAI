apiVersion: apps/v1
kind: Deployment
metadata:
  name: pipeline-api
  namespace: dataforge
  labels:
    app: pipeline-api
    accelerator: pipeline-automation
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pipeline-api
  template:
    metadata:
      labels:
        app: pipeline-api
    spec:
      containers:
      - name: api
        image: dataforge/pipeline-api:latest
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: DATAFORGE_ENV
          value: "production"
        - name: LOG_LEVEL
          value: "INFO"
        - name: POSTGRES_HOST
          valueFrom:
            secretKeyRef:
              name: dataforge-secrets
              key: postgres-host
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: dataforge-secrets
              key: postgres-password
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: pipeline-api
  namespace: dataforge
spec:
  selector:
    app: pipeline-api
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8000
  type: ClusterIP
