global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # MLOps API metrics
  - job_name: 'mlops-api'
    static_configs:
      - targets: ['mlops-api:8015']
    metrics_path: '/metrics'

  # MLflow metrics
  - job_name: 'mlflow'
    static_configs:
      - targets: ['mlflow:5000']
    metrics_path: '/metrics'

  # PostgreSQL metrics (if exporter is added)
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres:5432']

  # Redis metrics
  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']
