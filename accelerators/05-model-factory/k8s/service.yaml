apiVersion: v1
kind: Service
metadata:
  name: model-factory-service
  namespace: dataforge
  labels:
    app: model-factory
    tier: accelerator
spec:
  type: ClusterIP
  ports:
  - port: 8004
    targetPort: 8004
    protocol: TCP
    name: http
  selector:
    app: model-factory
---
apiVersion: v1
kind: Service
metadata:
  name: model-factory-external
  namespace: dataforge
  labels:
    app: model-factory
    tier: accelerator
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 8004
    protocol: TCP
    name: http
  selector:
    app: model-factory
---
apiVersion: v1
kind: Service
metadata:
  name: mlflow-service
  namespace: dataforge
  labels:
    app: mlflow
spec:
  type: ClusterIP
  ports:
  - port: 5000
    targetPort: 5000
    protocol: TCP
    name: http
  selector:
    app: mlflow
---
apiVersion: v1
kind: Service
metadata:
  name: mlflow-external
  namespace: dataforge
  labels:
    app: mlflow
spec:
  type: LoadBalancer
  ports:
  - port: 5000
    targetPort: 5000
    protocol: TCP
    name: http
  selector:
    app: mlflow
---
apiVersion: v1
kind: Service
metadata:
  name: minio-service
  namespace: dataforge
  labels:
    app: minio
spec:
  type: ClusterIP
  ports:
  - port: 9000
    name: api
  - port: 9001
    name: console
  selector:
    app: minio
