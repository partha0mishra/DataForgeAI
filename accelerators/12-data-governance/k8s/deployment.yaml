apiVersion: apps/v1
kind: Deployment
metadata:
  name: dataforge-data-governance
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dataforge-data-governance
  template:
    metadata:
      labels:
        app: dataforge-data-governance
    spec:
      containers:
      - name: governance-api
        image: dataforge/data-governance:latest
        ports:
        - containerPort: 8012
        env:
        - name: LOG_LEVEL
          value: "INFO"
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8012
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8012
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: dataforge-data-governance
spec:
  ports:
  - port: 8012
    targetPort: 8012
  selector:
    app: dataforge-data-governance
