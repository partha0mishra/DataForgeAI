apiVersion: apps/v1
kind: Deployment
metadata:
  name: dataforge-proposal-accelerator
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dataforge-proposal-accelerator
  template:
    metadata:
      labels:
        app: dataforge-proposal-accelerator
    spec:
      containers:
      - name: proposal-api
        image: dataforge/proposal-accelerator:latest
        ports:
        - containerPort: 8011
        env:
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: dataforge-secrets
              key: openai-api-key
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: dataforge-proposal-accelerator
spec:
  ports:
  - port: 8011
    targetPort: 8011
  selector:
    app: dataforge-proposal-accelerator
