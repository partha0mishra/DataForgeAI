apiVersion: apps/v1
kind: Deployment
metadata:
  name: dataforge-storytelling
  labels:
    app: dataforge-storytelling
    component: accelerator
    accelerator: "07"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dataforge-storytelling
  template:
    metadata:
      labels:
        app: dataforge-storytelling
        component: accelerator
        accelerator: "07"
    spec:
      containers:
      - name: storytelling-api
        image: dataforge/storytelling:latest
        ports:
        - containerPort: 8007
          name: http
          protocol: TCP
        env:
        - name: API_HOST
          value: "0.0.0.0"
        - name: API_PORT
          value: "8007"
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: dataforge-secrets
              key: openai-api-key
              optional: true
        - name: OPENAI_MODEL
          value: "gpt-4"
        - name: LOG_LEVEL
          value: "INFO"
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8007
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8007
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        volumeMounts:
        - name: config
          mountPath: /app/config
          readOnly: true
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: config
        configMap:
          name: dataforge-storytelling-config
          optional: true
      - name: tmp
        emptyDir: {}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dataforge-storytelling-config
  labels:
    app: dataforge-storytelling
data:
  config.yaml: |
    insight_extraction:
      confidence_threshold: 0.6
      max_insights: 10

    narrative_generation:
      default_style: "executive"
      default_format: "markdown"
      temperature: 0.7
      max_length: 2000

    report_building:
      default_title: "Data Storytelling Report"
      include_visualizations: true
---
apiVersion: v1
kind: Secret
metadata:
  name: dataforge-secrets
  labels:
    app: dataforge-storytelling
type: Opaque
stringData:
  # Set your OpenAI API key here or create secret separately
  # openai-api-key: "your-api-key-here"
