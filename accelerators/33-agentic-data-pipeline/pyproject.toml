[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-data-pipeline"
version = "0.1.0"
description = "GenAI-powered data pipeline code generator - Generate production-ready data pipelines from natural language"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "DataForgeAI Team", email = "team@dataforgeai.com"}
]
keywords = ["data-engineering", "genai", "llm", "pipeline", "databricks", "snowflake", "airflow", "dbt"]

dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "streamlit>=1.31.0",
    "langchain>=0.1.0",
    "langchain-openai>=0.0.5",
    "langchain-community>=0.0.20",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.1",
    "requests>=2.31.0",
    "httpx>=0.26.0",
    "sqlalchemy>=2.0.25",
    "chromadb>=0.4.22",
    "anthropic>=0.18.0",
    "boto3>=1.34.0",
    "tiktoken>=0.5.2",
    "pygments>=2.17.0",
    "typer>=0.9.0",
    "rich>=13.7.0",
    "jinja2>=3.1.3",
    "pandas>=2.2.0",
    "pyarrow>=15.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "black>=24.0.0",
    "ruff>=0.2.0",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
]

[project.scripts]
agentic-pipeline = "agentic_data_pipeline.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ['py310', 'py311']

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
