pipeline:
  name: "shopify_api_to_databricks_delta_live"
  platform: "databricks"
  orchestrator: "delta_live_tables"
  description: "Shopify order data ingestion using Delta Live Tables"

databricks:
  workspace_url: "https://your-workspace.cloud.databricks.com"
  cluster_id: "0123-456789-abcdef"
  warehouse_id: "abc123def456"
  catalog: "shopify_analytics"
  schema: "bronze"

shopify:
  api_version: "2025-01"
  store_url: "your-store.myshopify.com"
  # API credentials should be stored in Databricks Secrets
  secret_scope: "shopify_api"
  api_key_secret: "api_key"
  api_password_secret: "api_password"

delta_live_tables:
  target_schema: "shopify_analytics"
  storage_location: "s3://your-bucket/dlt/shopify"
  pipeline_mode: "continuous"

ingestion:
  endpoints:
    - orders
    - customers
    - products
  batch_size: 250
  checkpoint_location: "s3://your-bucket/checkpoints/shopify"

bronze:
  table_name: "orders_raw"
  format: "delta"

silver:
  table_name: "orders_clean"
  format: "delta"

gold:
  table_name: "orders_aggregated"
  format: "delta"
