version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: explainability-db
    environment:
      POSTGRES_DB: explainability
      POSTGRES_USER: explainai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-explainai_pass}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U explainai -d explainability"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - explainability-network

  # AI Explainability API
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: explainability-api
    environment:
      DATABASE_URL: postgresql://explainai:${POSTGRES_PASSWORD:-explainai_pass}@postgres:5432/explainability
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DEBUG: ${DEBUG:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ENABLE_SHAP: ${ENABLE_SHAP:-true}
      ENABLE_LIME: ${ENABLE_LIME:-true}
      ENABLE_ALIBI: ${ENABLE_ALIBI:-true}
      ENABLE_HALLUCINATION_CHECK: ${ENABLE_HALLUCINATION_CHECK:-true}
      ENABLE_BIAS_DETECTION: ${ENABLE_BIAS_DETECTION:-true}
    ports:
      - "8023:8023"
    volumes:
      - ./logs:/app/logs
      - ./src:/app/src
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8023/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - explainability-network

  # Prometheus for metrics
  prometheus:
    image: prom/prometheus:latest
    container_name: explainability-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - explainability-network
    restart: unless-stopped

  # Grafana for visualization
  grafana:
    image: grafana/grafana:latest
    container_name: explainability-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_INSTALL_PLUGINS: grafana-piechart-panel
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - explainability-network
    restart: unless-stopped

  # PgAdmin for database management (optional)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: explainability-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@explainai.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - explainability-network
    restart: unless-stopped
    profiles:
      - tools

volumes:
  postgres_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  explainability-network:
    driver: bridge
