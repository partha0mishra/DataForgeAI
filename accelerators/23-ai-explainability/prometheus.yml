global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'explainability-monitor'

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'explainability-api'
    static_configs:
      - targets: ['api:8023']
    metrics_path: '/metrics'
    scrape_interval: 30s
