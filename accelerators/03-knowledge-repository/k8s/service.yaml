apiVersion: v1
kind: Service
metadata:
  name: knowledge-repository-service
  namespace: dataforge
  labels:
    app: knowledge-repository
    tier: accelerator
spec:
  type: ClusterIP
  ports:
  - port: 8002
    targetPort: 8002
    protocol: TCP
    name: http
  selector:
    app: knowledge-repository
---
apiVersion: v1
kind: Service
metadata:
  name: knowledge-repository-external
  namespace: dataforge
  labels:
    app: knowledge-repository
    tier: accelerator
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 8002
    protocol: TCP
    name: http
  selector:
    app: knowledge-repository
