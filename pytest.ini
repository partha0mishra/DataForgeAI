[pytest]
# Pytest configuration for DataForge AI Platform

# Test discovery patterns
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Minimum version
minversion = 7.0

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    -p no:cacheprovider

# Markers
markers =
    integration: Integration tests (may be slow)
    slow: Slow tests (>1 second)
    requires_redis: Tests requiring Redis connection
    requires_postgres: Tests requiring PostgreSQL database
    requires_kafka: Tests requiring Kafka cluster
    unit: Fast unit tests
    api: API endpoint tests
    auth: Authentication tests
    db: Database tests
    cache: Caching tests

# Logging
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Coverage (if pytest-cov is installed)
[coverage:run]
source = shared-libraries,accelerators
omit =
    */tests/*
    */test_*
    */__pycache__/*
    */venv/*
    */virtualenv/*

[coverage:report]
precision = 2
skip_empty = true
show_missing = true
